[project]
name = "estoque-casd"
version = "0.1.0"
description = "Sistema para controle de estoque do Centro Acadêmico Santos Dumont (CASD)"
authors = [
    { name = "Arthur Vianna", email = "viannarth@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
]

[project.scripts]
estoque-casd = "estoque_casd:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
